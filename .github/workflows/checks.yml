name: ✅ Backend checks

# Runs on every push and on pull requests into main. It needs no secrets: everything runs against a
# throwaway MySQL started for the job. deploy.yml handles shipping main to EC2.
on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: atlas_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    # Throwaway values for the CI database only (not secrets). Grove points at the same MySQL:
    # the health check only pings it, and the sync stays off.
    # No NODE_ENV=production here: it would make `npm ci` skip devDependencies. The image sets its own.
    env:
      CORS_ORIGINS: http://localhost:3000
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: ci-root-password
      DATABASE_NAME: atlas_ci
      GROVE_DATABASE_HOST: 127.0.0.1
      GROVE_DATABASE_PORT: "3306"
      GROVE_DATABASE_USER: root
      GROVE_DATABASE_PASSWORD: ci-root-password
      GROVE_DATABASE_NAME: atlas_ci
      GROVE_SYNC_ENABLED: "false"
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      ADMIN_USERNAME: ci-admin
      ADMIN_EMAIL: ci-admin@atlas.local
      ADMIN_PASSWORD: ci-admin-password

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 📋 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Generate Prisma client
        run: npm run prisma:generate

      - name: 🔍 Type-check
        run: npm run typecheck

      - name: 🧪 Unit tests
        run: npm test

      - name: 🔨 Build TypeScript
        run: npm run build

      - name: 🗄️ Apply migrations to an empty MySQL
        run: npx prisma migrate deploy

      # Fails when schema.prisma was changed without creating a migration for it.
      - name: 🔎 Schema matches migrations
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: 🌱 Seed a CI admin user
        run: npm run seed:admin

      - name: 🐳 Build Docker image
        run: docker build -t atlas-v2-backend:ci .

      - name: 💨 Smoke-test the image
        run: |
          # -e NAME (no value) passes the job's own env value into the container.
          docker run -d --name atlas-v2-ci --network host \
            -e CORS_ORIGINS \
            -e DATABASE_HOST -e DATABASE_PORT -e DATABASE_USER -e DATABASE_PASSWORD -e DATABASE_NAME \
            -e GROVE_DATABASE_HOST -e GROVE_DATABASE_PORT -e GROVE_DATABASE_USER -e GROVE_DATABASE_PASSWORD -e GROVE_DATABASE_NAME \
            -e GROVE_SYNC_ENABLED -e JWT_SECRET \
            atlas-v2-backend:ci

          api=http://127.0.0.1:4000
          for i in $(seq 1 30); do
            if curl -fsS "$api/health" > health.json 2>/dev/null; then break; fi
            sleep 2
          done
          echo "health: $(cat health.json)"
          jq -e '.data.status == "ok" and .data.database == "up"' health.json > /dev/null

          token=$(curl -fsS -X POST "$api/api/auth/login" -H "Content-Type: application/json" \
            -d "{\"username\":\"$ADMIN_USERNAME\",\"password\":\"$ADMIN_PASSWORD\"}" | jq -r '.data.token')
          if [ -z "$token" ] || [ "$token" = "null" ]; then echo "::error::login failed"; exit 1; fi

          for board in artwork proofing; do
            curl -fsS "$api/api/jobs/$board/board" -H "Authorization: Bearer $token" \
              | jq -e '.data.machines | length > 0' > /dev/null
            echo "✅ $board board served"
          done

          status=$(curl -s -o /dev/null -w '%{http_code}' "$api/api/jobs/artwork/board")
          if [ "$status" != "401" ]; then echo "::error::expected 401 without a token, got $status"; exit 1; fi
          echo "✅ image boots, connects to MySQL, logs in and serves both boards"

      - name: 📋 Container logs
        if: always()
        run: docker logs atlas-v2-ci 2>&1 || true
